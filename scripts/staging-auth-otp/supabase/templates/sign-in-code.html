<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f5f5f2;color:#17211d;font-family:Arial,sans-serif">
    <main style="max-width:480px;margin:32px auto;padding:32px;background:#ffffff;border:1px solid #e2e7e4;border-radius:16px">
      <p style="font-size:13px;font-weight:bold;letter-spacing:2px;color:#426351">QAZIPRO</p>
      <h1 style="font-size:26px;line-height:1.3">Your sign-in code</h1>
      <p style="line-height:1.6">Enter this 8-digit code in the sign-in screen you already have open.</p>
      <p style="font-size:32px;font-weight:bold;letter-spacing:6px;padding:20px 12px;background:#f1f5f2;text-align:center;border-radius:10px">{{ .Token }}</p>
      <p style="line-height:1.6">This code expires shortly and can only be used once. Never share it with anyone.</p>
      <p style="font-size:13px;line-height:1.6;color:#526158">If you did not request this code, you can ignore this email.</p>
    </main>
  </body>
</html>
